<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fabrika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- La carte est dessinée dans ce canevas (voir src/render/renderer.js). -->
  <canvas id="game"></canvas>

  <!-- HUD : nom du jeu, objectif du tableau, carte, aide (voir src/ui/hud.js). -->
  <div id="hud" class="panel">
    <div class="brand"><b>Fabrika</b><span>Tableau 1</span></div>
    <div class="goal">
      <canvas id="goalIcon" width="7" height="7"></canvas>
      <div>
        <div class="goal-label" id="goalLabel"></div>
        <div class="barbg"><i id="goalFill"></i></div>
      </div>
      <b id="goalNum"></b>
    </div>
    <div class="meta">
      <span id="seedLbl">Carte</span>
      <span class="meta-buttons">
        <button id="sound" type="button" title="Activer ou couper le son (M)">Son : oui</button>
        <button id="reroll" type="button">Nouvelle carte</button>
      </span>
    </div>
    <div class="help">
      Glisse pour te déplacer · <kbd>WASD</kbd> / flèches · <kbd>+</kbd> <kbd>−</kbd> zoom<br>
      <kbd>R</kbd> tourner · <kbd>F</kbd> forme · <kbd>P</kbd> priorités · <kbd>M</kbd> son · clic droit efface · glisse un tapis pour le tracer<br>
      <kbd>0</kbd> Sélection (ou <kbd>Maj</kbd> + glisser) : encadre pour déplacer, copier, effacer
    </div>
  </div>

  <!-- Mini-carte (voir src/render/minimap.js). -->
  <div id="miniWrap" class="panel">
    <canvas id="mini" width="128" height="96"></canvas>
    <div id="coords">64 × 48 cases</div>
    <div id="perf"></div>
  </div>

  <!-- Palette d'outils, remplie par src/ui/toolbar.js. -->
  <div id="bar" class="panel" role="toolbar" aria-label="Outils"></div>

  <!-- Fiche du bâtiment cliqué (voir src/ui/infoPanel.js). -->
  <div id="infoPanel" class="panel" hidden></div>

  <!-- Menu des bâtiments sélectionnés (voir src/ui/selectionMenu.js). -->
  <div id="selMenu" class="panel" role="toolbar" aria-label="Sélection" hidden>
    <span class="sm-count"></span>
    <button type="button" data-action="move">Déplacer <kbd>X</kbd></button>
    <button type="button" data-action="copy">Copier <kbd>C</kbd></button>
    <button type="button" data-action="erase" class="sm-danger">Effacer <kbd>Suppr</kbd></button>
    <button type="button" data-action="close" class="sm-close" title="Désélectionner (Échap)">×</button>
  </div>

  <div id="toast" class="panel" hidden></div>
  <div id="hint" class="panel" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
