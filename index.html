<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fabrika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- La carte est dessinée dans ce canevas (voir src/render/renderer.js). -->
  <canvas id="game"></canvas>

  <!-- HUD : nom du jeu, niveau, commande à livrer (voir src/ui/hud.js). Le reste est dans le menu Échap. -->
  <div id="hud" class="panel">
    <div class="brand">
      <b>Fabrika</b>
      <span class="brand-right">
        <span id="hudOnline" hidden></span>
        <span id="boardLbl"></span>
        <button id="researchButton" type="button" data-i18n-title="research.open"><span data-i18n="research.button"></span><i id="researchBadge" hidden></i></button>
        <button id="menuButton" type="button" data-i18n="hud.menu" data-i18n-title="pause.open"></button>
      </span>
    </div>
    <!-- Commande du niveau en cours : une ligne par ressource (voir src/ui/hud.js). -->
    <div id="order" class="order"></div>
    <!-- Inventaire : les objets de construction en stock (voir src/world/inventory.js). -->
    <div id="inventory" class="inventory" role="button" tabindex="0" data-i18n-title="inventory.open"></div>
  </div>

  <!-- Menu Échap : sauvegarde, son, langue, multijoueur, aide (voir src/ui/pauseMenu.js). -->
  <div id="pause" hidden>
    <div class="pause-card panel">
      <div class="pause-head"><b data-i18n="pause.title"></b><span id="seedLbl"></span></div>
      <div class="win-body">

      <div id="pauseMain" class="pause-page">
        <button id="pResume" type="button" class="title-btn primary"><span data-i18n="pause.resume"></span></button>

        <div class="pause-row">
          <span data-i18n="hud.game"></span>
          <span class="meta-buttons">
            <button id="saveGame" type="button" data-i18n="hud.save" data-i18n-title="hud.save.title"></button>
            <button id="loadGame" type="button" data-i18n="hud.load"></button>
          </span>
        </div>
        <div class="pause-row">
          <span data-i18n="pause.sound"></span>
          <button id="sound" type="button"></button>
        </div>
        <label class="pause-row lang">
          <span data-i18n="hud.lang"></span>
          <select id="lang"></select>
        </label>
        <label class="pause-row lang">
          <span data-i18n="pause.uiScale"></span>
          <select id="uiScale"></select>
        </label>
        <!-- Multijoueur (voir src/ui/multiplayer.js et src/net/client.js). -->
        <div class="pause-row mp">
          <span data-i18n="mp.title"></span>
          <span class="meta-buttons" id="mpOff">
            <button id="mpHost" type="button" data-i18n="mp.host" data-i18n-title="mp.host.title"></button>
            <input id="mpCode" type="text" maxlength="4" autocomplete="off" spellcheck="false"
              data-i18n-placeholder="mp.code" data-i18n-aria="mp.code.aria">
            <button id="mpJoin" type="button" data-i18n="mp.join"></button>
          </span>
          <span class="meta-buttons" id="mpOn" hidden>
            <b id="mpCodeLbl"></b>
            <span id="mpPlayers"></span>
            <button id="mpLeave" type="button" data-i18n="mp.leave"></button>
          </span>
        </div>

        <div class="pause-buttons">
          <button id="pHelp" type="button" class="title-btn"><span data-i18n="pause.help"></span></button>
          <button id="pTitle" type="button" class="title-btn"><span data-i18n="pause.toTitle"></span></button>
        </div>
      </div>

      <!-- Aide : les contrôles. Les textes data-i18n viennent des dictionnaires (src/i18n/). -->
      <div id="pauseHelp" class="pause-page" hidden>
        <div class="help" data-i18n-html="hud.help"></div>
        <button id="pBack" type="button" class="title-btn"><span data-i18n="title.back"></span></button>
      </div>
      </div>
    </div>
  </div>

  <!-- Bandeau quand on est dans une usine (voir src/ui/factoryView.js). -->
  <div id="insideBar" class="panel" hidden>
    <b id="insideTitle"></b>
    <span class="inside-hint" data-i18n-html="inside.hint" data-i18n-title="inside.hint.long"></span>
    <button id="insideExit" type="button" data-i18n="inside.exit"></button>
  </div>

  <!-- Infobulle partagée (voir src/ui/tooltip.js). -->
  <div id="tooltip" class="tooltip panel" hidden></div>

  <!-- Fenêtre de l'inventaire (voir src/ui/inventoryWindow.js). -->
  <div id="inventoryWindow" hidden>
    <div class="inv-card panel">
      <div class="pause-head"><b data-i18n="inventory.title"></b><button id="invClose" type="button" class="rs-close" data-i18n-aria="research.close">×</button></div>
      <div class="win-body">
        <p class="rs-intro" data-i18n="inventory.intro"></p>
        <div id="invSlots"></div>
        <div id="invCosts" class="inv-costs"></div>
      </div>
    </div>
  </div>

  <!-- Arbre de recherche (voir src/ui/research.js). -->
  <div id="research" hidden>
    <div class="rs-card panel">
      <div class="pause-head"><b data-i18n="research.title"></b><button id="rsClose" type="button" class="rs-close" data-i18n-aria="research.close">×</button></div>
      <div class="win-body">
        <p class="rs-intro" data-i18n="research.intro"></p>
        <div id="rsBank" class="rs-bank"></div>
        <div id="rsTree" class="rs-tree"></div>
      </div>
    </div>
  </div>

  <!-- Mini-carte (voir src/render/minimap.js). -->
  <div id="miniWrap" class="panel">
    <canvas id="mini" width="128" height="96"></canvas>
    <div id="coords"></div>
    <div id="perf"></div>
  </div>

  <!-- Palette d'outils, remplie par src/ui/toolbar.js. -->
  <div id="bar" class="panel" role="toolbar" data-i18n-aria="hud.toolbar"></div>

  <!-- Fiche du bâtiment cliqué (voir src/ui/infoPanel.js). -->
  <div id="infoPanel" class="panel" hidden></div>

  <!-- Menu des bâtiments sélectionnés (voir src/ui/selectionMenu.js). -->
  <div id="selMenu" class="panel" role="toolbar" data-i18n-aria="selection.label" hidden>
    <span class="sm-count"></span>
    <button type="button" data-action="move"><span data-i18n="selection.move"></span> <kbd>X</kbd></button>
    <button type="button" data-action="copy"><span data-i18n="selection.copy"></span> <kbd>C</kbd></button>
    <button type="button" data-action="power" id="smPower"><span data-i18n="selection.power"></span> <kbd>O</kbd></button>
    <button type="button" data-action="erase" class="sm-danger"><span data-i18n="selection.erase"></span> <kbd data-i18n="selection.deleteKey"></kbd></button>
    <button type="button" data-action="close" class="sm-close" data-i18n-title="selection.close" data-i18n-aria="selection.close">×</button>
  </div>

  <!-- Curseurs des autres joueurs (voir src/ui/multiplayer.js). -->
  <div id="presence"></div>

  <!-- Écran titre, par-dessus la carte qui tourne en fond (voir src/ui/title.js). -->
  <div id="title" hidden>
    <div class="title-card panel">
      <canvas id="titleLogo"></canvas>
      <p class="title-tag" data-i18n="title.tagline"></p>
      <canvas id="titleBelt"></canvas>

      <div class="title-menu" id="titleMain">
        <button id="tNew" type="button" class="title-btn primary"><span data-i18n="title.new"></span></button>
        <button id="tContinue" type="button" class="title-btn" hidden>
          <span data-i18n="title.continue"></span><small id="tContinueDate"></small>
        </button>
        <button id="tHost" type="button" class="title-btn">
          <span data-i18n="title.host"></span><small data-i18n="title.host.detail"></small>
        </button>
        <button id="tJoin" type="button" class="title-btn"><span data-i18n="title.join"></span></button>
      </div>

      <div class="title-menu" id="titleJoin" hidden>
        <label class="title-code">
          <span data-i18n="title.code"></span>
          <input id="tCode" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="ABCD">
        </label>
        <button id="tJoinGo" type="button" class="title-btn primary"><span data-i18n="title.joinGo"></span></button>
        <button id="tBack" type="button" class="title-btn"><span data-i18n="title.back"></span></button>
      </div>

      <p id="titleStatus" class="title-status" role="status"></p>
      <div class="title-foot">
        <label><span data-i18n="hud.lang"></span> <select id="titleLang"></select></label>
        <span data-i18n="title.version"></span>
      </div>
    </div>
  </div>

  <!-- Carte de niveau : la commande à livrer, au début et après chaque niveau réussi (voir src/ui/levelCard.js). -->
  <div id="levelCard" class="panel" hidden></div>

  <div id="toast" class="panel" hidden></div>
  <div id="hint" class="panel" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
