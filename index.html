<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fabrika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- La carte est dessinée dans ce canevas (voir src/render/renderer.js). -->
  <canvas id="game"></canvas>

  <!-- HUD : nom du jeu, objectif du tableau, carte, aide (voir src/ui/hud.js). -->
  <div id="hud" class="panel">
    <div class="brand"><b>Fabrika</b><span id="boardLbl"></span></div>
    <div class="goal">
      <canvas id="goalIcon" width="7" height="7"></canvas>
      <div>
        <div class="goal-label" id="goalLabel"></div>
        <div class="barbg"><i id="goalFill"></i></div>
      </div>
      <b id="goalNum"></b>
    </div>
    <div class="meta">
      <span id="seedLbl">Carte</span>
      <span class="meta-buttons">
        <button id="sound" type="button"></button>
        <button id="reroll" type="button" data-i18n="hud.newMap"></button>
      </span>
    </div>
    <!-- Choix de la langue (voir src/i18n/). -->
    <label class="meta lang">
      <span data-i18n="hud.lang"></span>
      <select id="lang"></select>
    </label>
    <!-- Les textes marqués data-i18n viennent des dictionnaires (src/i18n/). -->
    <div class="help" data-i18n-html="hud.help"></div>
  </div>

  <!-- Mini-carte (voir src/render/minimap.js). -->
  <div id="miniWrap" class="panel">
    <canvas id="mini" width="128" height="96"></canvas>
    <div id="coords"></div>
    <div id="perf"></div>
  </div>

  <!-- Palette d'outils, remplie par src/ui/toolbar.js. -->
  <div id="bar" class="panel" role="toolbar" data-i18n-aria="hud.toolbar"></div>

  <!-- Fiche du bâtiment cliqué (voir src/ui/infoPanel.js). -->
  <div id="infoPanel" class="panel" hidden></div>

  <!-- Menu des bâtiments sélectionnés (voir src/ui/selectionMenu.js). -->
  <div id="selMenu" class="panel" role="toolbar" data-i18n-aria="selection.label" hidden>
    <span class="sm-count"></span>
    <button type="button" data-action="move"><span data-i18n="selection.move"></span> <kbd>X</kbd></button>
    <button type="button" data-action="copy"><span data-i18n="selection.copy"></span> <kbd>C</kbd></button>
    <button type="button" data-action="erase" class="sm-danger"><span data-i18n="selection.erase"></span> <kbd data-i18n="selection.deleteKey"></kbd></button>
    <button type="button" data-action="close" class="sm-close" data-i18n-title="selection.close" data-i18n-aria="selection.close">×</button>
  </div>

  <div id="toast" class="panel" hidden></div>
  <div id="hint" class="panel" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
